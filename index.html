<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космический Гороскоп</title>
    <style>
        :root {
            --bg-color: #0b0b1e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.12);
            --text-color: #ffffff;
            --accent-color: #7f5af0;
            --donate-color: #2cb67d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 100px 20px;
            background-image: radial-gradient(circle at 50% 50%, #161638 0%, #0b0b1e 100%);
        }
        h1 {
            margin: 20px 0 10px 0; font-size: 2.5rem; text-align: center;
            background: linear-gradient(45deg, #ff8e53, #ff007f, #7f5af0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 1rem; opacity: 0.7; margin-bottom: 30px; text-align: center; }
        .zodiac-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px; width: 100%; max-width: 800px; padding: 10px;
        }
        .zodiac-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 20px; text-align: center; cursor: pointer;
            transition: background 0.1s ease; color: var(--text-color); font-size: 1rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            outline: none; width: 100%;
        }
        .zodiac-card:active { background: var(--card-hover); }
        .zodiac-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; pointer-events: none; }
        .zodiac-name { font-weight: 600; display: block; pointer-events: none; }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 15, 0.95);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: #161630; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px;
            padding: 30px; max-width: 500px; width: 100%; text-align: center;
        }
        .modal-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .modal-title { font-size: 1.8rem; margin-bottom: 15px; color: var(--accent-color); }
        .modal-prediction { font-size: 1.1rem; line-height: 1.6; opacity: 0.9; margin-bottom: 25px; }
        .close-btn {
            background: var(--accent-color); color: #fff; border: none; padding: 12px 30px;
            font-size: 1rem; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; outline: none;
        }
        .footer-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px;
            background: rgba(11, 11, 30, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.1); 
            display: flex; justify-content: center; z-index: 900;
        }
        .donate-btn {
            background: var(--donate-color); color: #fff; border: none; padding: 12px 24px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px;
        }
    </style>
</head>
<body>

    <h1>Звёздный Оракул</h1>
    <p class="subtitle">Выберите ваш знак зодиака, чтобы узнать предсказание</p>

    <div class="zodiac-grid">
        <button type="button" class="zodiac-card" onclick="showHoroscope('aries', 'Овен', '♈')">
            <span class="zodiac-icon">♈</span><span class="zodiac-name">Овен</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('taurus', 'Телец', '♉')">
            <span class="zodiac-icon">♉</span><span class="zodiac-name">Телец</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('gemini', 'Близнецы', '♊')">
            <span class="zodiac-icon">♊</span><span class="zodiac-name">Близнецы</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('cancer', 'Рак', '♋')">
            <span class="zodiac-icon">♋</span><span class="zodiac-name">Рак</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('leo', 'Лев', '♌')">
            <span class="zodiac-icon">♌</span><span class="zodiac-name">Лев</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('virgo', 'Дева', '♍')">
            <span class="zodiac-icon">♍</span><span class="zodiac-name">Дева</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('libra', 'Весы', '♎')">
            <span class="zodiac-icon">♎</span><span class="zodiac-name">Весы</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('scorpio', 'Скорпион', '♏')">
            <span class="zodiac-icon">♏</span><span class="zodiac-name">Скорпион</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('sagittarius', 'Стрелец', '♐')">
            <span class="zodiac-icon">♐</span><span class="zodiac-name">Стрелец</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('capricorn', 'Козерог', '♑')">
            <span class="zodiac-icon">♑</span><span class="zodiac-name">Козерог</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('aquarius', 'Водолей', '♒')">
            <span class="zodiac-icon">♒</span><span class="zodiac-name">Водолей</span>
        </button>
        <button type="button" class="zodiac-card" onclick="showHoroscope('pisces', 'Рыбы', '♓')">
            <span class="zodiac-icon">♓</span><span class="zodiac-name">Рыбы</span>
        </button>
    </div>

    <div class="modal" id="predictionModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon"></div>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-prediction" id="modalPrediction"></div>
            <button type="button" class="close-btn" onclick="closeModalWindow()">Принять совет звёзд</button>
        </div>
    </div>

    <div class="footer-panel">
        <a href="#" target="_blank" class="donate-btn"><span>🌟 Донат звездочёту</span></a>
    </div>

    <script>
        var predictions = [
            "День идеален для важного шага. Ошибок не будет.",
            "Энергия дня требует тишины и покоя. Отдохните.",
            "Финансовые потоки растут. Ждите новостей.",
            "Откажитесь от спешки. Все придет вовремя.",
            "Интуиция обострена. Доверяйте первому импульсу.",
            "Время убрать лишнее из жизни и отпустить обиды.",
            "Ждите неожиданную встречу, которая изменит планы.",
            "Полноценный отдых сегодня вернет вам силы.",
            "Кто-то тайно ищет вашего внимания. Оглянитесь.",
            "Удача в переговорах. Все сложится в вашу пользу.",
            "День творчества. Запишите все новые задумки.",
            "Фокусируйтесь на главном. Мелкие неурядицы рассеются сами.",
            "Ваше обаяние на пике. Открываются новые двери.",
            "Осторожнее с обещаниями, берегите личную энергию.",
            "Обращайте внимание на знаки и мелкие совпадения.",
            "Благоприятный день для учебы и сбора информации.",
            "Не бойтесь просить о помощи близких людей.",
            "Романтика витает в воздухе. Вечер будет тёплым.",
            "Удачный момент для планирования крупных покупок.",
            "Внутренний компас указывает верный путь.",
            "Избегайте споров. Ваше спокойствие важнее всего.",
            "Старая проблема решится самым легким способом.",
            "Выйдите из зоны комфорта — риск себя оправдает.",
            "Замедлитесь и просто насладитесь текущим моментом.",
            "Удача ждет в цифровых делах и онлайн-проектах.",
            "Ожидайте искренний комплимент от незнакомца.",
            "День принесет баланс. Все тревоги отступят.",
            "Прошлое напомнит о себе. Шанс исправить ошибку.",
            "Проведите вечер дома в атмосфере уюта.",
            "Ваше упорство наконец даст первые крупные плоды.",
            "Говорите «нет» без стыда. Защищайте свои границы."
        ];

        // Хэш-алгоритм DJB2: теперь знаки гарантированно не перемешиваются
        function getPredictionIndex(signId) {
            var d = new Date();
            var dateStr = d.getFullYear().toString() + (d.getMonth() + 1).toString() + d.getDate().toString() + signId;
            var hash = 5381;
            for (var i = 0; i < dateStr.length; i++) {
                hash = ((hash << 5) + hash) + dateStr.charCodeAt(i);
            }
            return Math.abs(hash) % predictions.length;
        }

        function showHoroscope(id, name, icon) {
            var idx = getPredictionIndex(id);
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrediction').innerText = predictions[idx];
            document.getElementById('predictionModal').style.display = 'flex';
        }

        function closeModalWindow() {
