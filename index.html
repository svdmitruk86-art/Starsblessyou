<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космический Гороскоп</title>
    <style>
        :root {
            --bg-color: #0b0b1e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.12);
            --text-color: #ffffff;
            --accent-color: #7f5af0;
            --donate-color: #2cb67d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 100px 20px;
            background-image: radial-gradient(circle at 50% 50%, #161638 0%, #0b0b1e 100%);
        }
        h1 {
            margin: 20px 0 10px 0; font-size: 2.5rem; text-align: center;
            background: linear-gradient(45deg, #ff8e53, #ff007f, #7f5af0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 1rem; opacity: 0.7; margin-bottom: 30px; text-align: center; }
        .zodiac-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px; width: 100%; max-width: 800px; padding: 10px;
        }
        .zodiac-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 20px; text-align: center; cursor: pointer;
            transition: background 0.1s ease; color: var(--text-color); font-size: 1rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            outline: none; width: 100%;
        }
        .zodiac-card:active { background: var(--card-hover); }
        .zodiac-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; pointer-events: none; }
        .zodiac-name { font-weight: 600; display: block; pointer-events: none; }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 15, 0.95); display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: #161630; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px;
            padding: 30px; max-width: 500px; width: 100%; text-align: center;
        }
        .modal-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .modal-title { font-size: 1.8rem; margin-bottom: 15px; color: var(--accent-color); }
        .modal-prediction { font-size: 1.1rem; line-height: 1.6; opacity: 0.9; margin-bottom: 25px; }
        .close-btn {
            background: var(--accent-color); color: #fff; border: none; padding: 12px 30px;
            font-size: 1rem; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; outline: none;
        }
        .footer-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px;
            background: rgba(11, 11, 30, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.1); 
            display: flex; justify-content: center; z-index: 900;
        }
        .donate-btn {
            background: var(--donate-color); color: #fff; border: none; padding: 12px 24px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px;
        }
    </style>
</head>
<body>

    <h1>Звёздный Оракул</h1>
    <p class="subtitle">Выберите ваш знак зодиака, чтобы узнать предсказание</p>

    <!-- HTML очищен от инлайнового JS -->
    <div class="zodiac-grid">
        <button type="button" class="zodiac-card" data-sign="aries" data-name="Овен" data-icon="♈"><span class="zodiac-icon">♈</span><span class="zodiac-name">Овен</span></button>
        <button type="button" class="zodiac-card" data-sign="taurus" data-name="Телец" data-icon="♉"><span class="zodiac-icon">♉</span><span class="zodiac-name">Телец</span></button>
        <button type="button" class="zodiac-card" data-sign="gemini" data-name="Близнецы" data-icon="♊"><span class="zodiac-icon">♊</span><span class="zodiac-name">Близнецы</span></button>
        <button type="button" class="zodiac-card" data-sign="cancer" data-name="Рак" data-icon="♋"><span class="zodiac-icon">♋</span><span class="zodiac-name">Рак</span></button>
        <button type="button" class="zodiac-card" data-sign="leo" data-name="Лев" data-icon="♌"><span class="zodiac-icon">♌</span><span class="zodiac-name">Лев</span></button>
        <button type="button" class="zodiac-card" data-sign="virgo" data-name="Дева" data-icon="♍"><span class="zodiac-icon">♍</span><span class="zodiac-name">Дева</span></button>
        <button type="button" class="zodiac-card" data-sign="libra" data-name="Весы" data-icon="♎"><span class="zodiac-icon">♎</span><span class="zodiac-name">Весы</span></button>
        <button type="button" class="zodiac-card" data-sign="scorpio" data-name="Скорпион" data-icon="♏"><span class="zodiac-icon">♏</span><span class="zodiac-name">Скорпион</span></button>
        <button type="button" class="zodiac-card" data-sign="sagittarius" data-name="Стрелец" data-icon="♐"><span class="zodiac-icon">♐</span><span class="zodiac-name">Стрелец</span></button>
        <button type="button" class="zodiac-card" data-sign="capricorn" data-name="Козерог" data-icon="♑"><span class="zodiac-icon">♑</span><span class="zodiac-name">Козерог</span></button>
        <button type="button" class="zodiac-card" data-sign="aquarius" data-name="Водолей" data-icon="♒"><span class="zodiac-icon">♒</span><span class="zodiac-name">Водолей</span></button>
        <button type="button" class="zodiac-card" data-sign="pisces" data-name="Рыбы" data-icon="♓"><span class="zodiac-icon">♓</span><span class="zodiac-name">Рыбы</span></button>
    </div>

    <div class="modal" id="predictionModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon"></div>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-prediction" id="modalPrediction"></div>
            <button type="button" class="close-btn" id="closeBtn">Принять совет звёзд</button>
        </div>
    </div>

    <div class="footer-panel">
        <a href="#" target="_blank" class="donate-btn"><span>🌟 Донат звездочёту</span></a>
    </div>

    <script>
        var predictions = [
            "1. День идеален для важного шага. Ошибок не будет.",
            "2. Энергия дня требует тишины и покоя. Отдохните.",
            "3. Финансовые потоки растут. Ждите новостей.",
            "4. Откажитесь от спешки. Все придет вовремя.",
            "5. Интуиция обострена. Доверяйте первому импульсу.",
            "6. Время убрать лишнее из жизни и отпустить обиды.",
            "7. Ждите неожиданную встречу, которая изменит планы.",
            "8. Полноценный отдых сегодня вернет вам силы.",
            "9. Кто-то тайно ищет вашего внимания. Оглянитесь.",
            "10. Удача в переговорах. Все сложится в вашу пользу.",
            "11. День творчества. Запишите все новые задумки.",

            "13. Ваше обаяние на пике. Открываются новые двери.",
            "14. Осторожнее с обещаниями, берегите личную энергию.",
            "15. Обращайте внимание на знаки и мелкие совпадения.",
            "16. Благоприятный день для учебы и сбора информации.",
            "17. Не бойтесь просить о помощи близких людей.",
            "18. Романтика витает в воздухе. Вечер будет тёплым.",
            "19. Удачный момент для планирования крупных покупок.",
            "20. Внутренний компас указывает верный путь.",
            "21. Избегайте споров. Ваше спокойствие важнее всего.",
            "22. Старая проблема решится самым легким способом.",
            "23. Выйдите из зоны комфорта — риск себя оправдает.",
            "24. Замедлитесь и просто насладитесь текущим моментом.",
            "25. Удача ждет в цифровых делах и онлайн-проектах.",

        ];

        // Персональные сдвиги, чтобы знаки не пересекались в один день
        var shifts = {
            aries: 0, taurus: 3, gemini: 6, cancer: 9, leo: 12, virgo: 15,
            libra: 18, scorpio: 21, sagittarius: 24, capricorn: 27, aquarius: 1, pisces: 4
        };

        var modal = document.getElementById('predictionModal');

        // Новая неубиваемая логика подсчета по дням Unix (решает проблему смены года)
        function showHoroscope(id, name, icon) {
            var now = new Date();
            // Считаем количество полных дней, прошедших с 1 января 1970 года
            var totalDays = Math.floor(now.getTime() / (1000 * 60 * 60 * 24));
            
            // Рассчитываем уникальный индекс
            var idx = (totalDays + shifts[id]) % predictions.length;

            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrediction').innerText = predictions[idx];
            modal.style.display = 'flex';
        }

        function closeModalWindow() {
