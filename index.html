<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космический Гороскоп</title>
    <style>
        :root {
            --bg-color: #0b0b1e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.12);
            --text-color: #ffffff;
            --accent-color: #7f5af0;
            --accent-hover: #9370db;
            --donate-color: #2cb67d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 100px;
            background-image: radial-gradient(circle at 50% 50%, #161638 0%, #0b0b1e 100%);
        }

        h1 {
            margin: 20px 0 10px 0;
            font-size: 2.5rem;
            text-align: center;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff8e53, #ff007f, #7f5af0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.7;
            margin-bottom: 30px;
            text-align: center;
        }

        .zodiac-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 800px;
            padding: 10px;
        }

        .zodiac-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            outline: none;
            width: 100%;
        }

        @media (hover: hover) {
            .zodiac-card:hover {
                background: var(--card-hover);
                transform: translateY(-3px);
                border-color: var(--accent-color);
                box-shadow: 0 10px 20px rgba(127, 90, 240, 0.2);
            }
        }

        .zodiac-card:active {
            background: var(--card-hover);
            transform: scale(0.97);
        }

        .zodiac-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
            pointer-events: none;
        }

        .zodiac-name {
            font-weight: 600;
            display: block;
            pointer-events: none;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.85);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #161630;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .modal-prediction {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .close-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            outline: none;
        }

        .close-btn:active {
            background: var(--accent-hover);
        }

        .footer-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: rgba(11, 11, 30, 0.9);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            z-index: 900;
        }

        .donate-btn {
            background: var(--donate-color);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(44, 182, 125, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .donate-btn:active {
            transform: scale(0.95);
            background-color: #239666;
        }
    </style>
</head>
